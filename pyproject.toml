[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spy-arbfree-surface-gen"
version = "0.1.0"
description = "Arbitrage-free deep generative modeling and backtesting for SPY option surfaces"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
license = { text = "MIT" }
dependencies = [
  "cvxpy>=1.4.2",
  "httpx>=0.27.0",
  "matplotlib>=3.8.0",
  "nflows>=0.14",
  "numpy>=1.24.0",
  "osqp>=0.6.5",
  "pandas>=2.0.0",
  "pyarrow>=14.0.0",
  "pyyaml>=6.0.0",
  "torch>=2.2.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]
duckdb = ["duckdb>=1.0.0"]
ui = ["streamlit>=1.38.0"]

[project.scripts]
spygen = "spygen.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
