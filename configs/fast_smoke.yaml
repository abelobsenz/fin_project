paths:
  raw_dir: data/raw
  processed_dir: data/processed
  underlying_path: data/underlying/spy_eod.parquet
  outputs_dir: outputs

surface:
  x_min: -0.3
  x_max: 0.3
  nx: 21
  tenors_days: [7, 14, 30, 60, 90, 180]

repair:
  lambda_smooth: 0.001
  data_weight: 1.0

train:
  seed: 42
  batch_size: 128
  epochs: 8
  lr: 0.001
  weight_decay: 0.000001
  model_type: deep_smoothing
  hidden_size: 64
  flow_layers: 2
  flow_transform: affine
  flow_bins: 8
  target_mode: delta_theta_raw
  pca_lag_components: 2
  nll_weight: 0.2
  aux_price_weight: 1.0
  aux_iv_weight: 0.05
  aux_iv_core_weight: 0.15
  aux_mape_weight: 0.15
  aux_samples_train: 2
  aux_samples_eval: 8
  early_stop_metric: iv_rmse
  early_stopping_patience: 2
  iv_valid_margin: 0.0001
  iv_core_x_abs_max: 0.12
  iv_core_tenor_min_days: 14.0
  iv_loss: huber
  iv_huber_delta: 0.04
  min_vega_weight: 0.000001
  ds_hidden_size: 96
  ds_layers: 2
  ds_dropout: 0.05
  ds_corr_scale: 0.3
  ds_prior_blend: 0.2
  ds_num_experts: 2
  ds_sigma_min: 0.004
  ds_sigma_max: 0.1
  ds_sample_temperature: 1.0
  lambda_calendar: 3.0
  lambda_butterfly: 1.0
  lambda_asymptotic: 0.25

strategy:
  signal_provider: deep_flow
  run_all_providers: false
  providers: [deep_flow, climatology, last_value, linear_context]
  direction_mode: mean_revert
  threshold: 1.5
  zscore_quantile: 0.8
  min_history_for_quantile: 15
  min_signal_abs: 0.0005
  edge_cost_multiplier: 0.75
  edge_signal_to_usd_scale: 1.5
  residual_clip: 1.0
  reject_if_residual_clipped: false
  unit_sanity_check: true
  unit_sanity_fail_fast: false
  n_samples: 8
  max_trades_per_day: 3
  execution_mode: mid_plus_half_spread
  execution_impact_bps: 0.0
  execution_fee_per_contract: 0.0
  execution_worse_touch_extra_half_spread: 0.5
  spread_gate_mode: abs_or_rel
  max_spread_abs: 4.0
  max_spread_rel: 0.5
  max_contracts: 10
  max_notional: 25000
  seed: 42
  provider_overrides:
    climatology:
      threshold: 0.0
      zscore_quantile: 0.75
    last_value:
      threshold: 0.0
      zscore_quantile: 0.75
    linear_context:
      threshold: 0.0
      zscore_quantile: 0.8

walkforward:
  train_days: 40
  test_days: 10
  step_days: 10

tradier:
  base_url: https://api.tradier.com
  token_env_var: TRADIER_TOKEN
  cache_enabled: true
  cache_dir: data/tradier_cache
  connect_timeout: 10.0
  read_timeout: 30.0
  max_retries: 4
  backoff_base: 0.5

massive:
  base_url: https://api.massive.com
  api_key_env_var: MASSIVE_API_KEY
  max_history_days: 730
  cache_enabled: true
  cache_dir: data/massive_cache
  connect_timeout: 10.0
  read_timeout: 30.0
  max_retries: 4
  backoff_base: 0.5
  fallback_rel_spread: 0.12
  fallback_strike_band_pct: 0.25
  fallback_max_contracts_per_expiry: 80
  fallback_min_mid: 0.01

massive_flatfiles:
  endpoint_url: https://files.massive.com
  bucket: flatfiles
  prefix: us_options_opra/day_aggs_v1
  aws_access_key_id_env_var: MASSIVE_FILES_ACCESS_KEY_ID
  aws_secret_access_key_env_var: MASSIVE_FILES_SECRET_ACCESS_KEY
  cache_enabled: true
  cache_dir: data/massive_cache/flatfiles
  read_chunksize: 250000
  fallback_rel_spread: 0.08
  fallback_min_mid: 0.01

synth:
  seed: 123
  bad_quote_prob: 0.02
  strike_points: 21
